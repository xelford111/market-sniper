name: VENOM Lead-Lag Read-Only Proximity Audit
on:
  push:
    branches: [feature/venom-leadlag-paper-20261103]
    paths:
      - "venom-leadlag/read_only_audit.py"
      - ".github/workflows/venom-leadlag-readonly-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Static syntax verification
        run: python -m py_compile venom-leadlag/read_only_audit.py
      - name: Fetch ONLY public paper status and inspect near-miss signals
        run: python -u venom-leadlag/read_only_audit.py
